name: CI

# Every push to every branch, main included — `main` and `main-<short-sha>` give
# you something deployable from the tip of main before a release is cut.
#
# Branches only. A bare `push` also matches tags, and release-please's `vX.Y.Z`
# tag would start a run whose metadata is nonsense: `type=ref,event=branch`
# emits nothing on a tag ref and `prefix={{branch}}-` renders empty, so the
# image job asks for the invalid tag `:-<sha>` and buildx rejects it. There is
# nothing to build there anyway — release.yml re-tags the image this workflow
# already produced for that commit rather than rebuilding it.
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # STACK-SPECIFIC. Everything below this block is portable; this job is not.
  # This repo is a bare Dockerfile (no application code), so "verify" is a
  # Dockerfile lint rather than a language toolchain.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install hadolint
        env:
          VERSION: v2.15.1
          SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/$VERSION/hadolint-linux-x86_64"
          echo "$SHA256  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: hadolint Dockerfile
  # --------------------------- end stack-specific ----------------------------

  # Release-please's branch only bumps the version and rewrites the changelog,
  # and it is force-pushed on every merge to main — an image per force-push, and
  # nothing ever pulls it. `verify` still runs there so branch protection's
  # required checks can be satisfied on the release PR.
  image:
    name: Build and push image
    needs: verify
    if: ${{ !startsWith(github.ref_name, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 is built under emulation rather than on an arm runner. The
      # compiled unbound build makes this the more expensive trade here than
      # on an interpreted-language image, but a matrixed native-arm build plus
      # a digest-merge step is more moving parts than this small a repo
      # warrants; revisit if QEMU build times become a problem.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # The default docker driver builds one platform at a time. buildx's
      # container driver is what makes `platforms:` below build both at once.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces two tags, e.g. on branch `main` at commit a1b2c3d:
      #   ghcr.io/atgardner/unbound-docker:main
      #   ghcr.io/atgardner/unbound-docker:main-a1b2c3d
      # Slashes in branch names are slugified, so `renovate/foo` -> `renovate-foo`.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/atgardner/unbound-docker
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix={{branch}}-

      # Both tags now point at a manifest list rather than a single image, so
      # `docker pull` resolves per host arch. release.yml needs no change:
      # `buildx imagetools create` copies the whole index, so the release tag
      # inherits both platforms.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
