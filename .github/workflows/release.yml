name: Release

# Runs after CI succeeds on main, so the image for that commit already exists.
# release-please accumulates conventional commits into a release PR; merging it
# bumps the version, updates CHANGELOG.md, tags vX.Y.Z and creates the GitHub
# release. The image job then re-tags the image CI already built for that exact
# commit — no rebuild, so `latest` and `vX.Y.Z` are bit-for-bit what was tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release PR or release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # No GITHUB_TOKEN scopes: release-please runs entirely on the app token
    # minted below, which carries contents/issues/pull-requests write itself.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Events caused by the default GITHUB_TOKEN never trigger workflows —
      # GitHub suppresses them to prevent recursion. That is why the release
      # branch got no CI run and its required checks sat at "Expected" forever,
      # and why the PR, authored by github-actions[bot], had its `pull_request`
      # workflows held for maintainer approval. An app installation token is
      # exempt from that rule, so the push and the PR behave like a human's.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  image:
    name: Tag release image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/atgardner/unbound-docker
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # release-please's own version (vX.Y.Z) tracks this repo's commit
      # history, not unbound's - a repo-only fix bumps it same as an unbound
      # version bump would. Reading UNBOUND_VERSION off the exact commit this
      # release was cut from is what makes the extra tag below trustworthy.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Read the unbound version this build was pinned to
        id: unbound
        run: |
          set -euo pipefail
          version=$(grep -m1 '^ARG UNBOUND_VERSION=' Dockerfile | cut -d= -f2)
          if [ -z "$version" ]; then
            echo "::error::could not read UNBOUND_VERSION from Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the image CI built for this commit
        env:
          UNBOUND_VERSION: ${{ steps.unbound.outputs.version }}
        run: |
          set -euo pipefail

          # Must match ci.yml's `type=sha,format=short,prefix={{branch}}-`,
          # which metadata-action renders as `main-<7 chars of sha>`.
          source="$IMAGE:main-${HEAD_SHA:0:7}"
          echo "Source: $source"

          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "::error::$source not found — did CI's image job publish it?"
            exit 1
          fi

          # unbound-X.Y.Z moves to whichever release build most recently used
          # that unbound version; once a release bumps to a newer unbound
          # version, this tag stops moving and becomes a fixed pointer at the
          # last release that had it. Neither prune workflow touches it - it
          # always carries a tag, so the sweep treats it as a root, and it
          # never matches the branch/main-sha shapes the other two prune on.
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:unbound-$UNBOUND_VERSION" \
            "$source"

          docker buildx imagetools inspect "$IMAGE:$TAG" \
            --format '{{println .Manifest.Digest}}'
